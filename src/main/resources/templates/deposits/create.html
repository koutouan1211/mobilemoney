<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Effectuer un dépôt</title>

<link rel="stylesheet"
      th:href="@{/css/form.css}">

</head>

<body>

<div class="card">

<h2>DEPOT D'ARGENT</h2>

<form
th:action="@{/deposits/create}"
th:object="${depot}"
method="post">

<div class="form-group">

<label>Numéro de l'Agent</label>

<input
type="text"
th:field="*{numeroAgent}">

<div
class="error"
th:if="${#fields.hasErrors('numeroAgent')}"
th:errors="*{numeroAgent}">
</div>

</div>


<div class="form-group">

<label>Numéro du Client</label>

<input
type="text"
th:field="*{numeroClient}">

<div
class="error"
th:if="${#fields.hasErrors('numeroClient')}"
th:errors="*{numeroClient}">
</div>

</div>


<div class="form-group">

<label>Montant</label>

<input
type="number"
th:field="*{montant}">

<div
class="error"
th:if="${#fields.hasErrors('montant')}"
th:errors="*{montant}">
</div>

</div>


<div class="form-group">

<label>Motif</label>

<input
type="text"
th:field="*{motif}">

</div>


<input
type="hidden"
th:field="*{typeTransaction}"
th:value="${T(com.mobilemoney.transaction.domain.enums.TypeTransaction).DEPOT}"/>

<button type="submit">

Effectuer le dépôt

</button>

</form>

<div class="menu">

<a th:href="@{/transactions/history}">
Voir L'historique des transactions

</a>

<a th:href="@{/withdrawals/create}">

Effectuer un retrait

</a>

</div>

</div>

</body>

</html>

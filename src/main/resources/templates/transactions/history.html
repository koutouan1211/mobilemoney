<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Historique des transactions</title>

	<style>

	*{
	    margin:0;
	    padding:0;
	    box-sizing:border-box;
	    font-family:Arial, Helvetica, sans-serif;
	}

	body{

	    background:#f4f6f9;
	    padding:40px;

	}

	.container{

	    max-width:1200px;
	    margin:auto;
	    background:white;
	    padding:35px;
	    border-radius:12px;
	    box-shadow:0 5px 15px rgba(0,0,0,.15);

	}

	h2{

	    text-align:center;
	    color:#2c3e50;
	    margin-bottom:30px;

	}

	.search{

	    display:flex;
	    gap:15px;
	    margin-bottom:30px;

	}

	.search input{

	    flex:1;
	    padding:12px;
	    border:1px solid #ccc;
	    border-radius:6px;
	    font-size:15px;

	}

	.search input:focus{

	    outline:none;
	    border-color:#2ecc71;

	}

	.search button{

	    padding:12px 25px;
	    border:none;
	    border-radius:6px;
	    background:#27ae60;
	    color:white;
	    cursor:pointer;
	    font-size:15px;

	}

	.search button:hover{

	    background:#1e8449;

	}

	table{

	    width:100%;
	    border-collapse:collapse;

	}

	thead{

	    background:#27ae60;
	    color:white;

	}

	th,
	td{

	    padding:12px;
	    text-align:center;
	    border-bottom:1px solid #ddd;

	}

	tbody tr:nth-child(even){

	    background:#f8f9fa;

	}

	tbody tr:hover{

	    background:#ecfdf3;

	}

	.empty{

	    text-align:center;
	    color:#7f8c8d;
	    padding:25px;
	    font-style:italic;

	}

	.menu{

	    display:flex;
	    justify-content:space-between;
	    margin-top:30px;

	}

	.menu a{

	    text-decoration:none;
	    color:#2980b9;
	    font-weight:bold;

	}

	.menu a:hover{

	    text-decoration:underline;

	}

	</style>
	
</head>

<body>

<h2>Historique des transactions de l'agent</h2>


<form
    th:action="@{/transactions/history/search}"
    method="get">

    <label>Numéro de téléphone de l'agent :</label>

    <input
        type="text"
        name="numeroAgent"
        th:value="${numeroAgent}">

    <button type="submit">
        Rechercher
    </button>

</form>


<br>


<table
    border="1"
    th:if="${historique != null and !historique.isEmpty()}">

    <thead>

        <tr>

            <th>Référence</th>

            <th>Type</th>

            <th>Source</th>

            <th>Destination</th>

            <th>Montant</th>

            <th>Frais</th>

            <th>Statut</th>

            <th>Motif</th>

            <th>Date</th>

        </tr>

    </thead>


    <tbody>

        <tr th:each="transaction : ${historique}">

            <td th:text="${transaction.reference}">
            </td>

            <td th:text="${transaction.typeTransaction}">
            </td>

            <td th:text="${transaction.compteSource}">
            </td>

            <td th:text="${transaction.compteDestination}">
            </td>

            <td th:text="${transaction.montant}">
            </td>

            <td th:text="${transaction.frais}">
            </td>

            <td th:text="${transaction.statut}">
            </td>

            <td th:text="${transaction.motif}">
            </td>

            <td th:text="${transaction.dateTransaction}">
            </td>

        </tr>

    </tbody>

</table>


<div
class="empty"
th:if="${historique == null or historique.isEmpty()}">

Aucun dépôt trouvé.

</div>


<br>


<a th:href="@{/deposits/create}">

Retour au dépôt

</a>

<br>

<a th:href="@{/withdrawals/create}">

Effectuer un retrait

<br>



</body>

</html>

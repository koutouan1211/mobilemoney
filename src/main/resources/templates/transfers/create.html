<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Effectuer un transfert</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}

.card{

    width:600px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

h2{

    text-align:center;
    margin-bottom:30px;
    color:#2c3e50;

}

.form-group{

    margin-bottom:18px;

}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#34495e;

}

input,
select,
textarea{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;

}

input:focus,
select:focus,
textarea:focus{

    outline:none;
    border-color:#2ecc71;

}

textarea{

    resize:vertical;
    min-height:80px;

}

.error{

    color:#e74c3c;
    font-size:13px;
    margin-top:5px;
    display:block;

}

.success{

    background:#d4edda;
    color:#155724;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;

}

.menu{

    display:flex;
    justify-content:space-between;
    margin-top:25px;

}

.menu a{

    text-decoration:none;
    color:#2980b9;
    font-weight:bold;

}

.menu a:hover{

    text-decoration:underline;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:6px;
    background:#27ae60;
    color:white;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#1e8449;

}

</style>

</head>

<body>

<div class="card">

<h2>TRANSFERT D'ARGENT</h2>

<div
th:if="${erreur}"
class="error">

<span th:text="${erreur}"></span>

</div>


<div
th:if="${message}"
class="success">

<p th:text="${message}"></p>

<p>

Référence :

<strong th:text="${reference}"></strong>

</p>

</div>


<form
th:object="${transferRequest}"
th:action="@{/transfers/create}"
method="post">

<div class="form-group">

<label>Numéro de l'émetteur</label>

<input
type="text"
th:field="*{compteSource}"
placeholder="0700000001">

<p
class="error"
th:if="${#fields.hasErrors('compteSource')}"
th:errors="*{compteSource}">
</p>

</div>


<div class="form-group">

<label>Numéro du destinataire</label>

<input
type="text"
th:field="*{compteDestination}"
placeholder="0700000002">

<p
class="error"
th:if="${#fields.hasErrors('compteDestination')}"
th:errors="*{compteDestination}">
</p>

</div>


<div class="form-group">

<label>Montant</label>

<input
type="number"
th:field="*{montant}"
placeholder="1000">

<p
class="error"
th:if="${#fields.hasErrors('montant')}"
th:errors="*{montant}">
</p>

</div>


<div class="form-group">

<label>Type de transaction</label>

<select th:field="*{typeTransaction}">

<option value="">-- Choisir --</option>

<option
th:each="type : ${T(com.mobilemoney.transaction.domain.enums.TypeTransaction).values()}"
th:value="${type}"
th:text="${type}">
</option>

</select>

<p
class="error"
th:if="${#fields.hasErrors('typeTransaction')}"
th:errors="*{typeTransaction}">
</p>

</div>


<div class="form-group">

<label>Motif</label>

<textarea
th:field="*{motif}"
placeholder="Ex : Paiement de facture">
</textarea>

<p
class="error"
th:if="${#fields.hasErrors('motif')}"
th:errors="*{motif}">
</p>

</div>


<button type="submit">

Effectuer le transfert

</button>

</form>

<div class="menu">

<a th:href="@{/}">
Accueil
</a>

<a th:href="@{/transfers/history}">
Voir l'historique
</a>

</div>

</div>

</body>
</html>
